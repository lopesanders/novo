<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Imagem com Template</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Crie sua Imagem Personalizada</h1>
        <p>Envie sua foto, ajuste a posição e o zoom, e baixe!</p>

        <label for="imageLoader" class="custom-file-upload">
            Escolher Foto
        </label>
        <input type="file" id="imageLoader" accept="image/*"/>

        <div id="editorArea" class="canvas-container">
             <canvas id="imageCanvas"></canvas>
             <p id="loadingMessage" style="display: none;">Carregando e processando imagem...</p>
             <p id="instructionMessage" style="display: none;">Clique e arraste para mover. Use o scroll do mouse para zoom.</p>
        </div>


        <button id="downloadBtn" disabled>Baixar Imagem</button>

        <button id="shareBtn" style="display: none;">Compartilhar</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
